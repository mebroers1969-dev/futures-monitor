<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futures Orderflow & VWAP Monitor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 22px; color: #38bdf8; }
    .status-badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: #1e293b;
      border: 1px solid #475569;
    }
    .status-badge.connected { background: #065f46; color: #6ee7b7; border-color: #059669; }
    .status-badge.connecting { background: #854d0e; color: #fde047; border-color: #ca8a04; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .card-title { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .card-value { font-size: 22px; font-weight: 700; }
    
    .text-green { color: #34d399; }
    .text-red { color: #f87171; }
    .text-blue { color: #60a5fa; }

    .signal-box {
      background: #1e293b;
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }
    .signal-box.active {
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
    }
    .signal-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .signal-desc { font-size: 14px; color: #94a3b8; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid #334155;
    }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>BTCUSDT Perp Monitor</h1>
    <div id="wsStatus" class="status-badge connecting">Verbinden met Bybit...</div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="card-title">Huidige Prijs</div>
      <div id="valPrice" class="card-value">-</div>
    </div>
    <div class="card">
      <div class="card-title">Session VWAP</div>
      <div id="valVwap" class="card-value text-blue">-</div>
    </div>
    <div class="card">
      <div class="card-title">-2σ Band (Support)</div>
      <div id="valLowerBand" class="card-value text-red">-</div>
    </div>
    <div class="card">
      <div class="card-title">CVD (Delta van Sessie)</div>
      <div id="valCvd" class="card-value">-</div>
    </div>
  </div>

  <div id="signalBox" class="signal-box">
    <div id="signalTitle" class="signal-title">Wachten op Setup...</div>
    <div id="signalDesc" class="signal-desc">Data wordt binnengehaald via live Bybit stream.</div>
  </div>

  <h3 style="font-size: 15px; margin-bottom: 10px; color: #cbd5e1;">Recente 5m Candles & Trades</h3>
  <table>
    <thead>
      <tr>
        <th>Tijd</th>
        <th>Close</th>
        <th>VWAP</th>
        <th>Volume</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="candleTableBody">
      <tr><td colspan="5" style="text-align: center; color: #64748b;">Verbinden met feed...</td></tr>
    </tbody>
  </table>
</div>

<script>
  let currentPrice = 0;
  let cumulativeDelta = 0;
  let candles = [];
  let pingInterval = null;

  const wsStatus = document.getElementById('wsStatus');
  const valPrice = document.getElementById('valPrice');
  const valVwap = document.getElementById('valVwap');
  const valLowerBand = document.getElementById('valLowerBand');
  const valCvd = document.getElementById('valCvd');
  const signalBox = document.getElementById('signalBox');
  const signalTitle = document.getElementById('signalTitle');
  const signalDesc = document.getElementById('signalDesc');
  const candleTableBody = document.getElementById('candleTableBody');

  function initSocket() {
    // Bybit Linear v5 Public Stream (Geen restricties in NL/EU)
    const ws = new WebSocket('wss://stream.bybit.com/v5/public/linear');

    ws.onopen = () => {
      wsStatus.textContent = 'Live Verbonden (Bybit)';
      wsStatus.className = 'status-badge connected';

      // Abonneer op trades en klines (5m)
      const subPayload = {
        op: "subscribe",
        args: [
          "publicTrade.BTCUSDT",
          "kline.5.BTCUSDT"
        ]
      };
      ws.send(JSON.stringify(subPayload));

      // Bybit vereist elke 20 sec een ping om de verbinding open te houden
      pingInterval = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ op: "ping" }));
        }
      }, 20000);
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (!msg.topic) return;

      // 1. Live Trades verwerken (Tick-by-tick voor prijs & CVD)
      if (msg.topic === 'publicTrade.BTCUSDT' && msg.data) {
        msg.data.forEach(t => {
          currentPrice = parseFloat(t.p);
          const qty = parseFloat(t.v);
          // 'Buy' = Taker Buy op Ask (+), 'Sell' = Taker Sell op Bid (-)
          const delta = (t.S === 'Buy') ? qty : -qty;
          cumulativeDelta += delta;
        });

        valPrice.textContent = '$' + currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        valCvd.textContent = (cumulativeDelta >= 0 ? '+' : '') + cumulativeDelta.toFixed(2);
        valCvd.className = 'card-value ' + (cumulativeDelta >= 0 ? 'text-green' : 'text-red');

        evaluateSetup();
      }

      // 2. 5-Minuten Candles verwerken voor VWAP
      if (msg.topic === 'kline.5.BTCUSDT' && msg.data) {
        const k = msg.data[0];
        const candle = {
          time: new Date(parseInt(k.start)).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          open: parseFloat(k.open),
          high: parseFloat(k.high),
          low: parseFloat(k.low),
          close: parseFloat(k.close),
          volume: parseFloat(k.volume)
        };

        if (candles.length > 0 && candles[candles.length - 1].time === candle.time) {
          candles[candles.length - 1] = candle;
        } else {
          candles.push(candle);
          if (candles.length > 60) candles.shift();
        }

        calculateVWAP();
        renderTable();
        evaluateSetup();
      }
    };

    ws.onerror = (err) => {
      console.error('WS Error:', err);
      wsStatus.textContent = 'Verbindingsfout';
      wsStatus.className = 'status-badge';
    };

    ws.onclose = () => {
      wsStatus.textContent = 'Verbroken, herverbinden...';
      wsStatus.className = 'status-badge connecting';
      clearInterval(pingInterval);
      setTimeout(initSocket, 3000);
    };
  }

  function calculateVWAP() {
    if (candles.length === 0) return;

    let cumPV = 0;
    let cumVol = 0;

    candles.forEach(c => {
      const typical = (c.high + c.low + c.close) / 3;
      cumPV += typical * c.volume;
      cumVol += c.volume;
    });

    const vwap = cumVol > 0 ? cumPV / cumVol : currentPrice;

    // Standaarddeviatie
    let varianceSum = 0;
    candles.forEach(c => {
      const typical = (c.high + c.low + c.close) / 3;
      varianceSum += Math.pow(typical - vwap, 2) * c.volume;
    });

    const stdev = cumVol > 0 ? Math.sqrt(varianceSum / cumVol) : 0;
    const lowerBand2 = vwap - (2 * stdev);

    valVwap.textContent = '$' + vwap.toFixed(1);
    valLowerBand.textContent = '$' + lowerBand2.toFixed(1);

    window.currentVwap = vwap;
    window.currentLowerBand = lowerBand2;
  }

  function evaluateSetup() {
    if (!window.currentLowerBand || currentPrice === 0) return;

    const atSupport = currentPrice <= window.currentLowerBand;
    const absorption = cumulativeDelta > 0;

    if (atSupport && absorption) {
      signalBox.classList.add('active');
      signalTitle.innerHTML = '🚨 ABSORPTION LONG SETUP GEDETECTEERD!';
      signalTitle.style.color = '#34d399';
      signalDesc.textContent = `Prijs ($${currentPrice.toFixed(1)}) raakt de -2σ band ($${window.currentLowerBand.toFixed(1)}) met positieve CVD absorptie.`;
    } else if (atSupport) {
      signalBox.classList.remove('active');
      signalTitle.textContent = '👀 Prijs bij Support (Wachten op Absorptie)';
      signalTitle.style.color = '#facc15';
      signalDesc.textContent = 'Prijs is oversold (-2σ), maar CVD toont nog geen netto kopers.';
    } else {
      signalBox.classList.remove('active');
      signalTitle.textContent = 'Geen Actieve Setup';
      signalTitle.style.color = '#f8fafc';
      signalDesc.textContent = 'Markt consolideert binnen normale volatiliteitsbanden.';
    }
  }

  function renderTable() {
    const rows = [...candles].reverse().slice(0, 5).map(c => {
      return `
        <tr>
          <td>${c.time}</td>
          <td>$${c.close.toFixed(1)}</td>
          <td>${window.currentVwap ? '$' + window.currentVwap.toFixed(1) : '-'}</td>
          <td>${c.volume.toFixed(2)}</td>
          <td class="text-green">Actief</td>
        </tr>
      `;
    }).join('');
    candleTableBody.innerHTML = rows;
  }

  initSocket();
</script>
</body>
</html>
